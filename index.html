body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(
            ellipse at 50% 10%,
            rgba(65,73,95,.45),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #141a28 0%,
            #252b3b 20%,
            #575461 43%,
            #9c8991 64%,
            #d7bec2 82%,
            #f3dfe1 100%
        );

    background-attachment:fixed;
}
