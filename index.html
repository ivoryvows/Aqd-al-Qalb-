
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Background Test</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(
            ellipse at 50% 5%,
            rgba(255,255,255,.22),
            transparent 42%
        ),
        linear-gradient(
            180deg,
            #17294f 0%,
            #35446b 18%,
            #705678 38%,
            #a66d88 57%,
            #d99caf 76%,
            #f4d9dc 100%
        );

    background-attachment:fixed;
}

</style>
</head>

<body>
</body>
</html>
